spring:
  application:
    name: escuela-juridica-api
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: esejur
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: America/Lima
  mail:
    host: mail.aulavirtual.escuelajuridica.edu.pe
    port: 465
    username: notificaciones@aulavirtual.escuelajuridica.edu.pe
    password: "TW5#!klJwXeNFBV4"
    default-encoding: UTF-8
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

application:
  time-zone: America/Lima

cors:
  allowed-origin: http://localhost:4200

security:
  jwt:
    issuer: esejur-api
    secret: esejur-clave-entornos-no-productivos-2026
    expiration-minutes: 60
  cookie:
    name: ESEJUR_SESION
    secure: false
    same-site: Lax
